services:
    db:
        image: mysql:8.0
        container_name: gestion-servicios-db
        command: --log-bin-trust-function-creators=1
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_NAME:-gestion_servicios_db}
            MYSQL_USER: ${DB_USER:-app_servicios}
            MYSQL_PASSWORD: ${DB_PASSWORD:-dev_app_password}
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-dev_root_password}
            TZ: ${TZ:-UTC}
        ports:
            - "${DB_PORT:-3307}:3306"
        volumes:
            - mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
            interval: 10s
            timeout: 5s
            retries: 10

volumes:
    mysql_data:
