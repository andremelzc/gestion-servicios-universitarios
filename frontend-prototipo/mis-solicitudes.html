<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Mis solicitudes · Servicios Universitarios</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <main class="page" id="contenido" tabindex="-1">
    <div class="page-head">
      <h1>Mis solicitudes</h1>
      <a class="btn" href="nueva-solicitud.html">+ Nueva solicitud</a>
    </div>
      <form class="filters" id="filtros" role="search" aria-label="Filtrar solicitudes">
      <div class="field field--wide">
        <label for="q">Buscar por código o título</label>
        <input class="input" id="q" name="q" type="search" autocomplete="off" placeholder="Ej.: SOL-2026-0150 o proyector">
      </div>
      <div class="field">
        <label for="estado">Estado</label>
        <select class="select" id="estado" name="estado"><option value="">Todos</option></select>
      </div>
      <div class="field">
        <label for="prioridad">Prioridad</label>
        <select class="select" id="prioridad" name="prioridad"><option value="">Todas</option></select>
      </div>
    </form>
    <p class="results-count" id="contador" role="status" aria-live="polite"></p>
    <div id="resultado"></div>
    <nav class="pager" id="pager" aria-label="Paginación"></nav>
  </main>
  <script type="module" src="js/pages/mis-solicitudes.js"></script>
</body>
</html>
