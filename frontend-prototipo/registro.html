<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; base-uri 'self'; form-action 'self'">
  <title>Crear cuenta · Servicios Universitarios</title>
  <link rel="stylesheet" href="css/index.css">
</head>
<body>
  <main class="public" id="contenido">
    <div class="card">
      <p><a href="login.html">← Volver al inicio de sesión</a></p>
      <h1>Crear cuenta</h1>
      <div id="aviso" role="alert"></div>
      <form id="form-registro" class="form" novalidate>
        <div class="field">
          <label for="codigoInstitucional">Código institucional</label>
          <input class="input" id="codigoInstitucional" name="codigoInstitucional" type="text" autocomplete="off" required minlength="6" maxlength="20" placeholder="U20261045" aria-describedby="codigoInstitucional-error" aria-invalid="false">
          <p class="field-error" id="codigoInstitucional-error"></p>
        </div>
        <div class="form-row form-row--2">
          <div class="field">
            <label for="nombre">Nombres</label>
            <input class="input" id="nombre" name="nombre" type="text" autocomplete="given-name" required minlength="2" maxlength="50" aria-describedby="nombre-error" aria-invalid="false">
            <p class="field-error" id="nombre-error"></p>
          </div>
          <div class="field">
            <label for="apellido">Apellidos</label>
            <input class="input" id="apellido" name="apellido" type="text" autocomplete="family-name" required minlength="2" maxlength="50" aria-describedby="apellido-error" aria-invalid="false">
            <p class="field-error" id="apellido-error"></p>
          </div>
        </div>
        <div class="field">
          <label for="correo">Correo institucional</label>
          <input class="input" id="correo" name="correo" type="email" autocomplete="email" inputmode="email" required placeholder="juan@universidad.edu" aria-describedby="correo-error" aria-invalid="false">
          <p class="field-error" id="correo-error"></p>
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <div class="pw-wrap">
            <input class="input" id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-reglas password-error" aria-invalid="false">
            <button class="btn btn--link pw-toggle" id="ver-password" type="button">Mostrar</button>
          </div>
          <ul class="checklist" id="password-reglas" aria-label="Requisitos de la contraseña">
            <li data-regla="longitud" data-ok="false">8 caracteres</li>
            <li data-regla="mayuscula" data-ok="false">1 mayúscula</li>
            <li data-regla="numero" data-ok="false">1 número</li>
          </ul>
          <p class="field-error" id="password-error"></p>
        </div>
        <button class="btn btn--block" id="enviar" type="submit">Crear cuenta</button>
      </form>
    </div>
  </main>
  <script type="module" src="js/pages/registro.js"></script>
</body>
</html>
