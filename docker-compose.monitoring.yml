# Monitoreo (OBS-09): Prometheus + Grafana + Jaeger. Se combina con el compose base:
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml --profile monitoring up -d
# Prometheus scrapea backend:8081 (puerto de gestión, solo red interna; ver OBS-07).
services:
  backend:
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: gestion-servicios-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: gestion-servicios-grafana
    profiles: [monitoring]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be configured}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    container_name: gestion-servicios-jaeger
    profiles: [monitoring]
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"

volumes:
  prometheus_data:
  grafana_data:
