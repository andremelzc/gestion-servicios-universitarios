info:
  name: Cambiar Contraseña
  type: http
  seq: 6

http:
  method: PUT
  url: "{{baseUrl}}/api/v1/auth/cambiar-password"
  body:
    type: json
    data: |-
      {
        "passwordActual": "contraseña123_",
        "nuevaPassword": "MiPasswordNueva456!"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
