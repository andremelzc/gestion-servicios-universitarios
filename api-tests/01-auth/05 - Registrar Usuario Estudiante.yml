info:
  name: Registrar Usuario Estudiante
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/v1/auth/registro"
  body:
    type: json
    data: |-
      {
        "codigoInstitucional": "20269999",
        "nombre": "Carlos",
        "apellido": "Gutiérrez",
        "correo": "carlos.gutierrez@universidad.edu",
        "password": "PasswordSegura123!"
      }


runtime:
  scripts:
    - type: after-response
      code: |
        const data = typeof res.getBody === "function" ? res.getBody() : res.body;
        if (data && data.token) {
          bru.setVar("token", data.token);
          bru.setEnvVar("token", data.token);
        }
    - type: post-response
      code: |
        const data = typeof res.getBody === "function" ? res.getBody() : res.body;
        if (data && data.token) {
          bru.setVar("token", data.token);
          bru.setEnvVar("token", data.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
