components:
  schemas:
    SolicitudResolverRequest:
      type: object
      properties:
        informe:
          type: string
          maxLength: 2000
          minLength: 20
      required:
      - informe
    EvidenciaItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        tipo:
          type: string
        nombre:
          type: string
        mimeType:
          type: string
        tamanoBytes:
          type: integer
          format: int64
    SolicitudDetalleResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        titulo:
          type: string
        descripcion:
          type: string
        ubicacionCampus:
          type: string
        ubicacionAmbiente:
          type: string
        categoriaId:
          type: integer
          format: int32
        categoriaNombre:
          type: string
        areaId:
          type: integer
          format: int32
        areaNombre:
          type: string
        prioridadId:
          type: integer
          format: int32
        prioridadNivel:
          type: string
        estadoCodigo:
          type: string
        estadoNombre:
          type: string
        estadoColorHex:
          type: string
        solicitanteId:
          type: integer
          format: int64
        solicitanteNombreCompleto:
          type: string
        tecnicoId:
          type: integer
          format: int64
        tecnicoNombreCompleto:
          type: string
        informeResolucion:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaLimiteSla:
          type: string
          format: date-time
        fechaAsignacion:
          type: string
          format: date-time
        fechaInicioAtencion:
          type: string
          format: date-time
        fechaResolucion:
          type: string
          format: date-time
        fechaCierre:
          type: string
          format: date-time
        evidencias:
          type: array
          items:
            $ref: '#/components/schemas/EvidenciaItemResponse'
        accionesPermitidas:
          type: array
          items:
            type: string
    SolicitudEvaluarRequest:
      type: object
      description: Datos para la evaluación de una solicitud (GES-11 / US-23 / CA-6)
      properties:
        idPrioridad:
          type: integer
          format: int32
          description: Identificador de la nueva prioridad asignada (opcional)
          example: 3
          exclusiveMinimum: 0
        nota:
          type: string
          description: Nota u observación de pertinencia técnica (opcional)
          example: Prioridad ajustada debido al impacto en horario lectivo
          maxLength: 255
          minLength: 0
    SolicitudCerrarRequest:
      type: object
      description: Datos para el cierre formal de una solicitud (GES-13 / US-25 /
        CA-14)
      properties:
        nota:
          type: string
          description: Nota u observación de cierre y conformidad (opcional)
          example: Conforme con la solución brindada.
          maxLength: 255
          minLength: 0
    SolicitudAsignarRequest:
      type: object
      properties:
        idTecnico:
          type: integer
          format: int64
        nota:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - idTecnico
    PrioridadRequest:
      type: object
      properties:
        nivel:
          type: string
        ponderador:
          type: integer
          format: int32
        slaMaxHoras:
          type: integer
          format: int32
    PrioridadResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nivel:
          type: string
        ponderador:
          type: integer
          format: int32
        slaMaxHoras:
          type: integer
          format: int32
        activo:
          type: boolean
    EstadoRequest:
      type: object
      properties:
        nombreVisible:
          type: string
        descripcion:
          type: string
        colorHex:
          type: string
    EstadoResponse:
      type: object
      properties:
        codigo:
          type: string
        nombreVisible:
          type: string
        descripcion:
          type: string
        colorHex:
          type: string
        orden:
          type: string
          format: byte
        esFinal:
          type: boolean
    CategoriaRequest:
      type: object
      properties:
        nombre:
          type: string
        descripcion:
          type: string
        idArea:
          type: integer
          format: int32
        tiempoSlaHoras:
          type: integer
          format: int32
    CategoriaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        descripcion:
          type: string
        idArea:
          type: integer
          format: int32
        area:
          type: string
        tiempoSlaHoras:
          type: integer
          format: int32
        activo:
          type: boolean
    CambiarPasswordRequest:
      type: object
      properties:
        passwordActual:
          type: string
          minLength: 1
        nuevaPassword:
          type: string
          minLength: 1
      required:
      - nuevaPassword
      - passwordActual
    AreaRequest:
      type: object
      properties:
        nombre:
          type: string
        correoContacto:
          type: string
    AreaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        nombre:
          type: string
        correoContacto:
          type: string
        activo:
          type: boolean
    UsuarioActualizarRequest:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 50
          minLength: 2
        apellido:
          type: string
          maxLength: 50
          minLength: 2
        telefono:
          type: string
          maxLength: 20
          minLength: 0
        rol:
          type: string
          minLength: 1
          pattern: ESTUDIANTE|TECNICO|SUPERVISOR|ADMIN
        idArea:
          type: integer
          format: int32
          exclusiveMinimum: 0
      required:
      - apellido
      - nombre
      - rol
    UsuarioAdminResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigoInstitucional:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        correo:
          type: string
        telefono:
          type: string
        rol:
          type: string
        idArea:
          type: integer
          format: int32
        activo:
          type: boolean
    SolicitudCrearRequest:
      type: object
      properties:
        titulo:
          type: string
          maxLength: 150
          minLength: 5
        descripcion:
          type: string
          maxLength: 2000
          minLength: 10
        ubicacionCampus:
          type: string
          maxLength: 100
          minLength: 0
        ubicacionAmbiente:
          type: string
          maxLength: 100
          minLength: 0
        idCategoria:
          type: integer
          format: int32
        idPrioridad:
          type: integer
          format: int32
      required:
      - descripcion
      - idCategoria
      - idPrioridad
      - titulo
      - ubicacionAmbiente
      - ubicacionCampus
    SolicitudCreadaResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        codigo:
          type: string
        titulo:
          type: string
        estado:
          type: string
        fechaRegistro:
          type: string
          format: date-time
        fechaLimiteSla:
          type: string
          format: date-time
        mensaje:
          type: string
    ComentarioCrearRequest:
      type: object
      properties:
        comentario:
          type: string
          maxLength: 500
          minLength: 1
        privado:
          type: boolean
      required:
      - comentario
    ComentarioResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        comentario:
          type: string
        privado:
          type: boolean
        usuario:
          type: string
        fechaComentario:
          type: string
          format: date-time
    RegistroRequest:
      type: object
      properties:
        codigoInstitucional:
          type: string
          minLength: 1
          pattern: ^[A-Za-z0-9]{6,20}$
        nombre:
          type: string
          maxLength: 50
          minLength: 2
        apellido:
