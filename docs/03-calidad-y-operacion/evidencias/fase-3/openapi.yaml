openapi: 3.1.0
info:
  title: API de Gestión de Servicios Universitarios
  description: API REST para la gestión integral de servicios universitarios. Para
    probar operaciones protegidas, ingrese el JWT en Authorize.
  version: v1
servers:
- url: http://localhost:8080
  description: Generated server url
tags:
- name: Solicitudes
  description: Endpoints para registro, ciclo de vida, transiciones y consulta de
    solicitudes
- name: Catálogos
  description: Endpoints de consulta para catálogos maestros y activos
- name: Autenticación
  description: Endpoints para inicio de sesión, registro y gestión de credenciales
- name: Dashboard
  description: Indicadores operativos según el alcance del usuario autenticado
- name: Usuarios
  description: Endpoints de consulta de personal técnico y usuarios
- name: Catálogos
  description: Administración de catálogos
paths:
  /api/v1/solicitudes/{id}/resolver:
    put:
      tags:
      - Solicitudes
      summary: Resolver solicitud
      description: Transiciona de EN_ATENCION a RESUELTA requiriendo informe técnico
        explicativo (mínimo 20 caracteres) y entre 1 y 3 archivos de evidencia.
      operationId: resolver
      parameters:
      - name: id
        in: path
        description: ID único de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 150
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                datos:
                  $ref: '#/components/schemas/SolicitudResolverRequest'
                archivos:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - datos
      responses:
        '200':
          description: Solicitud resuelta con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '400':
          description: Informe menor a 20 caracteres o cantidad de evidencias no permitida
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '401':
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '403':
          description: Solo el técnico asignado o un administrador pueden resolver
            la solicitud
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '404':
          description: Solicitud no encontrada o fuera del alcance
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '409':
          description: La solicitud no se encuentra en estado EN_ATENCION
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '413':
          description: Un archivo adjunto excede los 5 MB
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '415':
          description: Formato de archivo no permitido
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
      security:
      - bearerAuth: []
  /api/v1/solicitudes/{id}/iniciar-atencion:
    put:
      tags:
      - Solicitudes
      summary: Iniciar atención operativa
      description: Transiciona la solicitud de ASIGNADA a EN_ATENCION y registra la
        fecha de inicio de intervención técnica.
      operationId: iniciarAtencion
      parameters:
      - name: id
        in: path
        description: ID único de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 150
      responses:
        '200':
          description: Atención iniciada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '401':
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '403':
          description: Solo el técnico asignado o un administrador pueden iniciar
            atención
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '404':
          description: Solicitud no encontrada o fuera del alcance
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '409':
          description: La solicitud no se encuentra en estado ASIGNADA
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
      security:
      - bearerAuth: []
  /api/v1/solicitudes/{id}/evaluar:
    put:
      tags:
      - Solicitudes
      summary: Evaluar solicitud
      description: Permite al supervisor del área o administrador evaluar una solicitud
        en estado REGISTRADA, pasando a EN_EVALUACION con ajuste opcional de prioridad
        y recálculo de SLA.
      operationId: evaluar
      parameters:
      - name: id
        in: path
        description: ID único de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 150
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudEvaluarRequest'
      responses:
        '200':
          description: Solicitud evaluada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '400':
          description: Parámetros inválidos (ej. prioridad no válida o nota con HTML)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '401':
          description: No autenticado o credenciales inválidas
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '403':
          description: No autorizado (no pertenece al área de la solicitud ni es admin)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '404':
          description: Solicitud no encontrada o fuera del alcance
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '409':
          description: Transición inválida (la solicitud no está en estado REGISTRADA)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
      security:
      - bearerAuth: []
  /api/v1/solicitudes/{id}/cerrar:
    put:
      tags:
      - Solicitudes
      summary: Cerrar solicitud
      description: Cierra formalmente una solicitud en estado RESUELTA pasando a CERRADA
        y registrando la fecha de cierre. Puede ser ejecutado por el usuario solicitante,
        el supervisor del área o el administrador.
      operationId: cerrar
      parameters:
      - name: id
        in: path
        description: ID único de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 150
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCerrarRequest'
      responses:
        '200':
          description: Solicitud cerrada con éxito
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '400':
          description: Nota de cierre inválida o con HTML
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '401':
          description: No autenticado o credenciales inválidas
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '403':
          description: No autorizado (no es el solicitante, supervisor del área ni
            admin)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '404':
          description: Solicitud no encontrada o fuera del alcance
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '409':
          description: Transición inválida (la solicitud no se encuentra en estado
            RESUELTA)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
      security:
      - bearerAuth: []
  /api/v1/solicitudes/{id}/asignar:
    put:
      tags:
      - Solicitudes
      summary: Asignar o reasignar técnico
      description: Asigna o reasigna un técnico del área responsable a la solicitud,
        transicionando a ASIGNADA y registrando la nota en el historial.
      operationId: asignar
      parameters:
      - name: id
        in: path
        description: ID único de la solicitud
        required: true
        schema:
          type: integer
          format: int64
        example: 150
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudAsignarRequest'
        required: true
      responses:
        '200':
          description: Técnico asignado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '400':
          description: Técnico inactivo o perteneciente a otra área
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '401':
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '403':
          description: No autorizado (no es supervisor del área ni admin)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '404':
          description: Solicitud o técnico no encontrado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
        '409':
          description: Estado actual no permite asignación
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudDetalleResponse'
      security:
      - bearerAuth: []
  /api/v1/prioridades/{id}:
    put:
      tags:
      - Catálogos
      summary: Actualizar prioridad
      operationId: actualizarPrioridad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrioridadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrioridadResponse'
    delete:
      tags:
      - Catálogos
      summary: Desactivar prioridad
      operationId: desactivarPrioridad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
  /api/v1/prioridades/{id}/reactivar:
    put:
      tags:
      - Catálogos
      summary: Reactivar prioridad
      operationId: reactivarPrioridad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrioridadResponse'
  /api/v1/estados/{codigo}:
    put:
      tags:
      - Catálogos
      summary: Actualizar presentación de estado
      operationId: actualizarEstado
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstadoRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EstadoResponse'
  /api/v1/categorias/{id}:
    get:
      tags:
      - Catálogos
      summary: Consultar categoría
      operationId: categoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: incluirInactivos
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
    put:
      tags:
      - Catálogos
      summary: Actualizar categoría
      operationId: actualizarCategoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoriaRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
    delete:
      tags:
      - Catálogos
      summary: Desactivar categoría
      operationId: desactivarCategoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
  /api/v1/categorias/{id}/reactivar:
    put:
      tags:
      - Catálogos
      summary: Reactivar categoría
      operationId: reactivarCategoria
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CategoriaResponse'
  /api/v1/auth/cambiar-password:
    put:
      tags:
      - Autenticación
      summary: Cambiar contraseña
      description: Permite al usuario autenticado actualizar su contraseña actual
        por una nueva que cumpla las políticas de seguridad.
      operationId: cambiarPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarPasswordRequest'
        required: true
      responses:
        '204':
          description: Contraseña cambiada exitosamente
        '400':
          description: La contraseña actual es incorrecta o la nueva contraseña no
            cumple los requisitos
        '401':
          description: No autenticado o token vencido
      security:
      - bearerAuth: []
  /api/v1/areas/{id}:
    get:
      tags:
      - Catálogos
      summary: Consultar área
      operationId: area
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: incluirInactivos
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaResponse'
    put:
      tags:
      - Catálogos
      summary: Actualizar área
      operationId: actualizarArea
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AreaRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaResponse'
    delete:
      tags:
      - Catálogos
      summary: Desactivar área
      operationId: desactivarArea
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
  /api/v1/areas/{id}/reactivar:
    put:
      tags:
      - Catálogos
      summary: Reactivar área
      operationId: reactivarArea
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AreaResponse'
  /api/v1/admin/usuarios/{id}:
    get:
      tags:
      - admin-usuarios-controller
      operationId: obtener
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsuarioAdminResponse'
    put:
      tags:
      - admin-usuarios-controller
      operationId: actualizar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioActualizarRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsuarioAdminResponse'
    delete:
      tags:
      - admin-usuarios-controller
      operationId: desactivar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '204':
          description: No Content
  /api/v1/admin/usuarios/{id}/reactivar:
    put:
      tags:
      - admin-usuarios-controller
      operationId: reactivar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/UsuarioAdminResponse'
  /api/v1/solicitudes:
    get:
      tags:
      - Solicitudes
      summary: Listar bandeja operativa de solicitudes
      description: Consulta la bandeja general con filtros por estado, prioridad,
        categoría, técnico, rango de fechas y vencimiento SLA. El alcance se restringe
        automáticamente según el rol del usuario.
      operationId: listarBandeja
      parameters:
      - name: estado
        in: query
        description: Lista de códigos de estado a filtrar
        required: false
        schema:
          type: array
          items:
            type: string
      - name: idPrioridad
        in: query
        description: ID de prioridad
        required: false
        schema:
          type: integer
          format: int32
      - name: idCategoria
        in: query
        description: ID de categoría
        required: false
        schema:
          type: integer
          format: int32
      - name: idTecnico
        in: query
        description: ID de técnico asignado
        required: false
        schema:
          type: integer
          format: int64
      - name: q
        in: query
        description: Texto a buscar en código o título
        required: false
        schema:
          type: string
      - name: desde
        in: query
        description: Fecha inicial de registro (ISO DATE_TIME)
        required: false
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        description: Fecha final de registro (ISO DATE_TIME)
        required: false
        schema:
          type: string
          format: date-time
      - name: vencidas
        in: query
        description: Filtrar únicamente solicitudes con SLA vencido
        required: false
        schema:
          type: boolean
      - name: pageable
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Pageable'
      responses:
        '200':
          description: Página de solicitudes en bandeja operativa
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageSolicitudResumenResponse'
        '400':
          description: Parámetros de filtrado o paginación inválidos
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageSolicitudResumenResponse'
        '401':
          description: No autenticado
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageSolicitudResumenResponse'
        '403':
          description: Acceso denegado (estudiantes no tienen acceso a la bandeja
            operativa)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageSolicitudResumenResponse'
      security:
      - bearerAuth: []
    post:
      tags:
      - Solicitudes
      summary: Registrar solicitud
      description: Registra una nueva solicitud de servicio institucional adjuntando
        opcionalmente entre 0 y 3 archivos de evidencia (JPG, PNG o PDF de hasta 5
        MB).
      operationId: crear
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                solicitud:
                  $ref: '#/components/schemas/SolicitudCrearRequest'
                archivos:
                  type: array
                  items:
                    type: string
                    format: binary
              required:
              - solicitud
      responses:
        '201':
          description: Solicitud creada exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudCreadaResponse'
        '400':
          description: Datos de solicitud inválidos o categoría/prioridad inexistente
            o inactiva
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudCreadaResponse'
        '401':
          description: No autenticado o token vencido
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudCreadaResponse'
        '413':
          description: El tamaño de un archivo adjunto excede los 5 MB
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudCreadaResponse'
        '415':
          description: Tipo de archivo no permitido (solo JPG, PNG y PDF)
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SolicitudCreadaResponse'
      security:
      - bearerAuth: []
  /api/v1/solicitudes/{id}/comentarios:
    get:
      tags:
      - comentario-controller
      operationId: listar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComentarioResponse'
    post:
      tags:
      - comentario-controller
      operationId: crear_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComentarioCrearRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ComentarioResponse'
  /api/v1/prioridades:
    get:
      tags:
      - Catálogos
      summary: Listar prioridades activas
      description: Retorna el catálogo de prioridades activas ordenadas por ponderador
        ascendente con su tiempo máximo SLA.
      operationId: listarPrioridades
      parameters:
      - name: incluirInactivos
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Listado de prioridades obtenido exitosamente
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PrioridadResponse'
    post:
      tags:
      - Catálogos
      summary: Crear prioridad
      operationId: crearPrioridad
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrioridadRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PrioridadResponse'
  /api/v1/categorias:
    get:
      tags:
      - Catálogos
      summary: Listar categorías activas
      description: Retorna el listado de categorías activas para el registro de solicitudes,
        con filtro opcional por área.
      operationId: listarCategorias
      parameters:
      - name: idArea
        in: query
        description: ID del área para filtrar categorías
        required: false
        schema:
          type: integer
          format: int32
      - name: incluirInactivos
        in: query
        required: false
        schema:
          type: boolean
          default: false
