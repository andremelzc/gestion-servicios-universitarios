name: CD Pipeline - Staging

on:
  push:
    branches:
      - develop

jobs:
  ci:
    name: Pruebas (CI)
    uses: ./.github/workflows/ci.yml

  deploy-backend:
    name: Desplegar Backend a Render
    needs: [ci]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_STAGING_HOOK }}" ]; then
            echo "::error::El secreto RENDER_STAGING_HOOK no está configurado en GitHub Secrets."
            exit 1
          fi
          echo "Iniciando despliegue del Backend en Render (Staging)..."
          curl -X GET "${{ secrets.RENDER_STAGING_HOOK }}"
          echo " Petición de despliegue enviada a Render."

  deploy-frontend:
    name: Desplegar Frontend a Vercel
    needs: [ci]
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar Vercel CLI
        run: npm i -g vercel
      - name: Vercel pull
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Vercel build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Vercel deploy
        run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
