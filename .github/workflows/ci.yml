name: Pipeline CI - Integración Continua

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-build-test:
    name: Backend CI (Spring Boot & Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilación y Pruebas Backend
        working-directory: backend
        run: mvn -B clean verify

  frontend-build-lint:
    name: Frontend CI (React, Lint & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalación de dependencias Frontend
        working-directory: frontend
        run: npm ci

      - name: Linting Frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Pruebas Frontend
        working-directory: frontend
        run: npm test --if-present

      - name: Compilación Frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-build-test, frontend-build-lint]
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar build Docker Backend
        if: hashFiles('backend/Dockerfile') != ''
        run: docker build -t backend:ci -f backend/Dockerfile .

      - name: Validar build Docker Frontend
        if: hashFiles('frontend/Dockerfile') != ''
        run: docker build -t frontend:ci frontend/
