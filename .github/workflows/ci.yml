name: Pipeline CI - Integración Continua

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  backend-build-test:
    name: Backend CI (Spring Boot & MySQL Test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilación y Pruebas Unitarias Backend
        run: |
          if [ -d "backend" ]; then
            cd backend
            mvn clean test
          else
            echo "Directorio backend aún no inicializado, omitiendo build."
          fi

  frontend-build-lint:
    name: Frontend CI (React & Linting)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache-dependency-path: frontend/package-lock.json

      - name: Instalación y Verificación Frontend
        run: |
          if [ -d "frontend" ]; then
            cd frontend
            npm ci
            npm run lint --if-present
            npm test --if-present -- --watchAll=false
            npm run build
          else
            echo "Directorio frontend aún no inicializado, omitiendo build."
          fi
