name: Pipeline CD - Despliegue a Producción

on:
  # Despliegue automático a Producción al integrar cambios en main
  push:
    branches:
      - main
    tags:
      - 'v*' # También se ejecuta al crear un tag de versión, ej: v1.0.0
  # Permite lanzar el despliegue manualmente desde la pestaña Actions
  workflow_dispatch:

jobs:
  ci:
    name: Pruebas (CI)
    uses: ./.github/workflows/ci.yml

  publish-ghcr:
    name: Publicar Imágenes en GHCR (prod)
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Construir y publicar imágenes etiquetadas con SHA y versión
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          BACKEND_IMAGES=("ghcr.io/${REPO_LOWER}/backend:sha-${SHORT_SHA}")
          FRONTEND_IMAGES=("ghcr.io/${REPO_LOWER}/frontend:sha-${SHORT_SHA}")

          # En main/tag se publica además el tag mutable "prod"
          if [ "${GITHUB_REF}" = "refs/heads/main" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            BACKEND_IMAGES+=("ghcr.io/${REPO_LOWER}/backend:prod")
            FRONTEND_IMAGES+=("ghcr.io/${REPO_LOWER}/frontend:prod")
          fi

          # En un tag vX.Y.Z se publica también la versión exacta
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            BACKEND_IMAGES+=("ghcr.io/${REPO_LOWER}/backend:${GITHUB_REF_NAME}")
            FRONTEND_IMAGES+=("ghcr.io/${REPO_LOWER}/frontend:${GITHUB_REF_NAME}")
          fi

          BACKEND_ARGS=()
          for image in "${BACKEND_IMAGES[@]}"; do
            BACKEND_ARGS+=(-t "$image")
          done

          FRONTEND_ARGS=()
          for image in "${FRONTEND_IMAGES[@]}"; do
            FRONTEND_ARGS+=(-t "$image")
          done

          docker build -f backend/Dockerfile "${BACKEND_ARGS[@]}" .
          docker build --build-arg VITE_API_URL=/api/v1 "${FRONTEND_ARGS[@]}" ./frontend

          for image in "${BACKEND_IMAGES[@]}" "${FRONTEND_IMAGES[@]}"; do
            docker push "$image"
          done

  deploy-render:
    name: Desplegar Backend a Render
    needs: [ci, publish-ghcr]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "::error::El secreto RENDER_DEPLOY_HOOK no está configurado en GitHub Secrets."
            exit 1
          fi
          echo "Iniciando despliegue en Render..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo " Petición de despliegue enviada a Render."

  deploy-vercel:
    name: Desplegar Frontend a Vercel
    needs: [ci, publish-ghcr]
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Instalar Vercel CLI
        run: npm i -g vercel
      - name: Vercel pull
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Vercel build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Vercel deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  smoke-test:
    name: Smoke Test (Salud del Backend)
    runs-on: ubuntu-latest
    needs: [deploy-render]
    environment: production
    steps:
      - name: Verificar Actuator Health en producción
        run: |
          backend_url="${{ vars.PROD_BACKEND_URL }}"
          if [ -z "$backend_url" ]; then
            echo "::error::La variable PROD_BACKEND_URL no está configurada en el Environment production."
            exit 1
          fi
          echo "Esperando el despliegue de Render (arranque en frío puede tardar)..."
          # Render tarda en levantar el contenedor: hasta ~10 min de reintentos
          body=$(curl -fsS --retry 30 --retry-delay 20 --retry-all-errors --max-time 60 "$backend_url/actuator/health")
          echo "$body"
          echo "$body" | grep -q '"status":"UP"'
