spring:
    application:
        name: servicios
    config:
        import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
    profiles:
        default: dev
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: validate
        properties:
            hibernate:
                jdbc:
                    time_zone: UTC
    flyway:
        enabled: true
        locations: classpath:db/migration

server:
    port: ${SERVER_PORT:8080}

management:
    endpoints:
        web:
            exposure:
                include: health,info
    endpoint:
        health:
            probes:
                enabled: true
