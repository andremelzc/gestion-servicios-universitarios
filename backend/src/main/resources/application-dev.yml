spring:
    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:gestion_servicios_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${DB_USER:app_servicios}
        password: ${DB_PASSWORD:dev_app_password}
        hikari:
            maximum-pool-size: ${DB_POOL_SIZE:10}
            connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}

    flyway:
        user: ${FLYWAY_USER:${DB_USER:app_servicios}}
        password: ${FLYWAY_PASSWORD:${DB_PASSWORD:dev_app_password}}

server:
    error:
        include-message: always
