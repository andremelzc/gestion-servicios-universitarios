spring:
    datasource:
        url: jdbc:h2:mem:servicios_test;MODE=MySQL;DB_CLOSE_DELAY=-1
        username: sa
        password:
        driver-class-name: org.h2.Driver
    jpa:
        hibernate:
            ddl-auto: update
    flyway:
        enabled: false

springdoc:
    api-docs:
        enabled: ${SWAGGER_ENABLED:true}
    swagger-ui:
        enabled: ${SWAGGER_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
